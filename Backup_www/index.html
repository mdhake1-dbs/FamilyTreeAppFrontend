<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta http-equiv="Content-Security-Policy"
          content="
            default-src 'self' data: gap: https://ssl.gstatic.com https://familytreeapp.duckdns.org;
            img-src 'self' data: blob: https://familytreeapp.duckdns.org;
            style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
            font-src 'self' data: https://fonts.gstatic.com;
            script-src 'self' 'unsafe-inline' 'unsafe-eval';
            connect-src 'self' https://familytreeapp.duckdns.org;
            media-src *;
          ">
    <title>Family Tree Manager</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <!-- AUTH SCREEN -->
    <div id="authScreen" class="auth-container">
      <div class="auth-header">
        <div class="logo">👨‍👩‍👧‍👦</div>
        <h1 class="auth-title">Family Tree</h1>
        <p class="auth-subtitle">Manage Your Family History</p>
      </div>

      <div id="authMessage" class="message"></div>

      <div class="auth-tabs">
        <button
          id="tabLogin"
          class="auth-tab active"
          type="button"
          onclick="switchAuthTab('login')"
        >
          Login
        </button>
        <button
          id="tabRegister"
          class="auth-tab"
          type="button"
          onclick="switchAuthTab('register')"
        >
          Register
        </button>
      </div>

      <form id="loginForm" class="auth-form">
        <div class="form-group">
          <label>Username</label>
          <input
            id="loginUsername"
            type="text"
            placeholder="Enter username"
            required
            autocomplete="username"
          />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input
            id="loginPassword"
            type="password"
            placeholder="Enter password"
            required
            autocomplete="current-password"
          />
        </div>
        <button type="submit" class="btn-primary btn-full">Login</button>
      </form>

      <form id="registerForm" class="auth-form hidden">
        <div class="form-group">
          <label>Username</label>
          <input
            id="regUsername"
            type="text"
            placeholder="Choose username"
            required
            autocomplete="username"
          />
        </div>
        <div class="form-group">
          <label>Password (min 6 chars)</label>
          <input
            id="regPassword"
            type="password"
            placeholder="Choose password"
            required
            minlength="6"
            autocomplete="new-password"
          />
        </div>
        <div class="form-group">
          <label>Email (required)</label>
         <input
            id="regEmail"
            type="email"
            placeholder="Enter email"
            autocomplete="email"
            required
            />
        </div>
        <div class="form-group">
          <label>Full Name (optional)</label>
          <input
            id="regFullName"
            type="text"
            placeholder="Enter full name"
            autocomplete="name"
          />
        </div>
        <button type="submit" class="btn-primary btn-full">Register</button>
      </form>
    </div>

    <!-- APP SCREEN -->
    <div id="appScreen" class="hidden app-wrapper">
      <!-- Mobile Header -->
      <div class="mobile-header">
        <button class="menu-btn" type="button" onclick="toggleMobileMenu()">
          <span class="menu-icon">☰</span>
        </button>
        <div class="header-title">Family Tree</div>
        <button class="profile-btn" type="button" onclick="toggleProfile()">
          <span class="profile-icon">👤</span>
        </button>
      </div>

      <!-- Sidebar Overlay -->
      <div
        id="sidebarOverlay"
        class="sidebar-overlay"
        onclick="toggleMobileMenu()"
      ></div>

      <!-- Sidebar -->
      <div id="mobileNav" class="mobile-nav hidden">
        <div class="mobile-nav-header">
          <span id="mobileUserName" class="mobile-user-name">User</span>
          <button class="close-btn" type="button" onclick="toggleMobileMenu()">
            ✕
          </button>
        </div>
        <nav class="mobile-nav-menu">
          <button
            class="nav-item"
            type="button"
            onclick="showHome(); toggleMobileMenu();"
          >
            <span class="nav-icon">🏠</span> Home
          </button>
          <button
            class="nav-item"
            type="button"
            onclick="showAddPerson(); toggleMobileMenu();"
          >
            <span class="nav-icon">➕</span> Add Person
          </button>
          <button
            class="nav-item"
            type="button"
            onclick="showPeople(); toggleMobileMenu();"
          >
            <span class="nav-icon">👥</span> People
          </button>
          <button
            class="nav-item"
            type="button"
            onclick="showAddRelationship(); toggleMobileMenu();"
          >
            <span class="nav-icon">🔗</span> Add Relationship
          </button>
          <button
            class="nav-item"
            type="button"
            onclick="showViewRelationships(); toggleMobileMenu();"
          >
            <span class="nav-icon">📊</span> Relationships
          </button>
          <button
            class="nav-item"
            type="button"
            onclick="showAddEvent(); toggleMobileMenu();"
          >
            <span class="nav-icon">📅</span> Add Event
          </button>
          <button
            class="nav-item"
            type="button"
            onclick="showViewEvents(); toggleMobileMenu();"
          >
            <span class="nav-icon">📋</span> Events
          </button>
          <button
            class="nav-item logout-item"
            type="button"
            onclick="logout();"
          >
            <span class="nav-icon">🚪</span> Logout
          </button>
        </nav>
      </div>

      <div class="main-content">
        <div id="messageBox" class="message"></div>

        <!-- HOME PAGE -->
        <div id="homePage" class="section">
          <div class="home-card">
            <div class="home-icon">👨‍👩‍👧‍👦</div>
            <h2>Welcome to Your Family Tree</h2>
            <p class="home-text">
              Build and explore your family history with ease
            </p>
            <div class="home-actions">
              <button class="btn-primary" onclick="showAddPerson()">
                Add Person
              </button>
              <button class="btn-secondary" onclick="showPeople()">
                View People
              </button>
            </div>
          </div>
        </div>

        <!-- PROFILE SECTION -->
        <div id="profileSection" class="section hidden">
          <div class="card">
            <h2 class="card-header">Profile</h2>
            <form id="profileForm">
              <div class="profile-avatar-wrapper">
                <img
                  id="profileAvatar"
                  class="profile-avatar"
                  src="img/avatar-placeholder.png"
                  alt="Profile"
                />
                <button
                  type="button"
                  class="camera-btn"
                  onclick="changeProfilePhoto()"
                >
                  📷
                </button>
              </div>

              <div class="form-group">
                <label>Full Name</label>
                <input
                  id="profileFullName"
                  type="text"
                  placeholder="Enter full name"
                />
              </div>

              <div class="form-group">
                <label>Email</label>
                <input
                  id="profileEmail"
                  type="email"
                  placeholder="Enter email"
                />
              </div>

              <div class="form-group">
                <label>New Password</label>
                <input
                  id="profilePassword"
                  type="password"
                  placeholder="Leave blank to keep current"
                />
              </div>

              <div class="form-actions">
                <button
                  type="button"
                  class="btn-primary"
                  onclick="updateProfile()"
                >
                  Save Changes
                </button>
                <button
                  type="button"
                  class="btn-secondary"
                  onclick="toggleProfile()"
                >
                  Cancel
                </button>
              </div>
            </form>
          </div>
        </div>

        <!-- ADD/EDIT PERSON FORM -->
        <div id="personFormSection" class="section hidden">
          <div class="card">
            <h2 class="card-header" id="personFormTitle">Add New Person</h2>

            <form id="personForm">
              <input type="hidden" id="personId" />

              <div class="form-header">
                <div class="form-avatar">
                  <img
                    id="personAvatar"
                    class="form-avatar-img"
                    src="img/avatar-placeholder.png"
                    alt="Person"
                  />
                  <button
                    type="button"
                    class="form-avatar-btn"
                    onclick="changePersonPhoto()"
                  >
                    📷
                  </button>
                </div>
              </div>

              <div class="form-row">
                <div class="form-group">
                  <label>Given Name</label>
                  <input
                    id="givenName"
                    type="text"
                    placeholder="First name"
                    required
                  />
                </div>
                <div class="form-group">
                  <label>Family Name</label>
                  <input
                    id="familyName"
                    type="text"
                    placeholder="Last name"
                    required
                  />
                </div>
              </div>

              <div class="form-group">
                <label>Gender</label>
                <select id="gender">
                  <option value="">Select gender...</option>
                  <option>Male</option>
                  <option>Female</option>
                  <option>Other</option>
                </select>
              </div>

              <div class="form-row">
                <div class="form-group">
                  <label>Life Status</label>
                  <select id="lifeStatus" onchange="toggleDeathDate()">
                    <option value="alive">Alive</option>
                    <option value="deceased">Deceased</option>
                  </select>
                </div>
                <div class="form-group">
                  <label>Birth Date</label>
                  <input id="birthDate" type="date" />
                </div>
              </div>

              <div id="deathDateGroup" class="form-group hidden">
                <label>Death Date</label>
                <input id="deathDate" type="date" />
              </div>

              <div class="form-group">
                <label>Birth Place</label>
                <input
                  id="birthPlace"
                  type="text"
                  placeholder="City, Country"
                />
              </div>

              <div class="form-group">
                <label>Biography</label>
                <textarea
                  id="bio"
                  rows="4"
                  placeholder="Tell their story..."
                ></textarea>
              </div>

              <div class="form-actions">
                <button type="submit" id="submitBtn" class="btn-primary">
                  Add Person
                </button>
                <button
                  type="button"
                  class="btn-secondary"
                  onclick="cancelAddEdit()"
                >
                  Cancel
                </button>
                <button
                  type="button"
                  id="deletePersonBtn"
                  class="btn-delete hidden"
                  onclick="deletePerson(editingId)"
                >
                  Delete Person
                </button>
              </div>
            </form>
          </div>
        </div>

        <!-- PEOPLE LIST -->
        <div id="peopleSection" class="section hidden">
          <div class="section-header">
            <h2>People</h2>
            <div class="section-actions">
              <button
                class="btn-secondary btn-sm"
                type="button"
                onclick="loadPeople()"
              >
                Refresh
              </button>
              <button
                class="btn-primary btn-sm"
                type="button"
                onclick="showAddPerson()"
              >
                + Add
              </button>
            </div>
          </div>
          <div id="peopleList" class="list-container"></div>
        </div>

        <!-- RELATIONSHIPS SECTION -->
        <div id="relationshipsSection" class="section hidden">
          <div class="card">
            <h2 class="card-header" id="relationshipFormTitle">Add Relationship</h2>
            <div id="relMessage" class="message"></div>

            <form id="relationshipForm">
              <input type="hidden" id="relationshipId" />

              <div class="form-group">
                <label>Person</label>
                <select id="relPerson1" required>
                  <option value="">Select person...</option>
                </select>
              </div>

              <div class="form-group">
                <label>Relation Type</label>
                <select id="relType" required>
                  <option value="">Select relation...</option>
                </select>
              </div>

              <div class="form-group">
                <label>Related To</label>
                <select id="relPerson2" required>
                  <option value="">Select person...</option>
                </select>
              </div>

              <div class="form-actions">
                <button type="submit" id="relSubmitBtn" class="btn-primary">
                  Add Relationship
                </button>
                <button
                  type="button"
                  class="btn-secondary"
                  onclick="resetRelationshipForm()"
                >
                  Clear
                </button>
              </div>
            </form>

            <div id="relationshipsList" class="list-container"></div>
          </div>
        </div>

        <!-- EVENTS SECTION -->
        <div id="eventsSection" class="section hidden">
          <div class="card">
            <h2 class="card-header" id="eventFormTitle">Add Event</h2>
            <div id="eventMessage" class="message"></div>

            <form id="eventForm">
              <input type="hidden" id="eventId" />

              <div class="form-group">
                <label>Person</label>
                <select id="eventPerson" required>
                  <option value="">Select person...</option>
                </select>
              </div>

              <div class="form-group">
                <label>Title</label>
                <input
                  id="eventTitle"
                  type="text"
                  placeholder="Event title"
                  required
                />
              </div>

              <div class="form-group">
                <label>Date</label>
                <input id="eventDate" type="date" />
              </div>

              <div class="form-group">
                <label>Place</label>
                <input id="eventPlace" type="text" placeholder="Location" />
              </div>

              <div class="form-group">
                <label>Description</label>
                <textarea
                  id="eventDescription"
                  rows="3"
                  placeholder="Event details..."
                ></textarea>
              </div>

              <div class="form-actions">
                <button type="submit" id="eventSubmitBtn" class="btn-primary">
                  Add Event
                </button>
                <button
                  type="button"
                  class="btn-secondary"
                  onclick="resetEventForm()"
                >
                  Clear
                </button>
              </div>
            </form>

            <div id="eventsList" class="list-container"></div>
          </div>
        </div>
      </div>
      
      <!-- Confirmation Modal (Single Reusable) -->
      <div id="confirmModal" class="modal">
        <div class="modal-content">
          <p id="confirmMessage">Are you sure?</p>
          <div class="modal-actions">
            <button id="confirmYes" class="btn-primary">Yes</button>
            <button id="confirmNo" class="btn-secondary">No</button>
          </div>
        </div>
      </div>
    </div>
    
    <!-- Media Picker -->
    <div id="mediaPicker" class="media-picker hidden">
      <div class="media-sheet">
        <button onclick="pickCamera()">📷 Camera</button>
        <button onclick="pickGallery()">🖼 Photos</button>
        <button class="cancel" onclick="closeMediaPicker()">Cancel</button>
      </div>
    </div>

    <script type="text/javascript" src="cordova.js"></script>
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
